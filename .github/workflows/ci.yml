name: gate

# This repository is PUBLIC and its claims are mathematical, so the thing worth
# automating is not style but whether every claim is still supported by the
# evidence committed beside it. That is exactly what verify_all.py answers, and
# until now it was only ever run by hand.
#
# Actions minutes are free on public repositories, so this costs nothing against
# the account quota.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: these jobs only ever read the checkout. Declared
# explicitly so the workflow keeps its own floor even if the repository
# default token permission is widened later.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Measured: the full gate takes 11 s locally, so a job still running at 15
    # minutes has hung rather than got slower. Bounded because an unbounded job
    # burns GitHub's default of 360.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Pinned. The audits below re-derive results through this solver, and a
      # gate whose verdict depends on which day it runs is not a gate -- the
      # same lesson an unpinned ruff taught this project once already.
      - name: Install the SAT solver the audits run through
        run: pip install python-sat==1.9.dev7

      # Runs first and costs nothing: an identity leak in a public repository is
      # the one failure here that cannot be undone by a later commit.
      - name: No machine-local paths in a public repository
        run: python scrub_paths.py --check

      # The repository's own gate, in full. The two slow audits are included:
      # they are what check the CNF against the definition rather than against
      # a previous run of itself.
      #
      # The staging-folder sections skip on a runner by design -- ~/OEIS-upload
      # is machine-local and never committed.
      - name: Re-check every claim against the evidence on disk
        run: python verify_all.py
  # The gitleaks binary directly rather than gitleaks-action, and the whole
  # history rather than a diff. The action scans only the range
  # <before>^..<after> that a push touched, so a secret committed earlier and
  # never edited again is never looked at; and on a repository's first push the
  # parent of the root commit does not exist, so it fails outright.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --exit-code 1 --log-opts=--all
